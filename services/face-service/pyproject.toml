[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-service"
version = "0.3.0"
description = "Face Attendance System — facial recognition service (Phase 3: InsightFace + ONNX Runtime, CPU)."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Face Attendance" }]
# Pinned to the latest stable releases as of Phase 3.
# - insightface: 1.0.1 (MIT source / non-commercial-research model weights).
# - onnxruntime: 1.29.0 (CPU provider only; do NOT install onnxruntime-gpu alongside).
# - opencv-python: 4.13.0.92 (first stable build with NumPy 2.x ABI fixes).
# - numpy: 2.1.3 — matches the opencv-python 4.13.0.92 minimum on Python 3.13.
dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "numpy==2.1.3",
    "opencv-python==4.13.0.92",
    "onnx==1.22.0",
    "onnxruntime==1.29.0",
    "insightface==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require the real InsightFace model on disk and a local CPU environment.",
    "model: tests that load the actual InsightFace recognition model.",
]
